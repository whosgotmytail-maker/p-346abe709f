const u=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
async function open_(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(D.s),iterations:D.n,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u(D.i)},key,u(D.c));
  return new TextDecoder().decode(pt);
}
async function show(pw,remember){
  const html=await open_(pw);
  if(remember){ try{ localStorage.setItem("d28-pw",pw); }catch(e){} }
  document.open(); document.write(html); document.close();
}
const f=document.getElementById("f"), msg=document.getElementById("msg"), go=document.getElementById("go");
f.addEventListener("submit",async e=>{
  e.preventDefault(); msg.textContent=""; go.disabled=true; go.textContent="여는 중…";
  try{ await show(document.getElementById("pw").value.trim(),true); }
  catch(err){ msg.textContent="비밀번호가 맞지 않아요."; go.disabled=false; go.textContent="열기"; }
});
(async()=>{ let saved=null; try{ saved=localStorage.getItem("d28-pw"); }catch(e){}
  if(saved){ try{ await show(saved,false); }catch(e){ try{ localStorage.removeItem("d28-pw"); }catch(_){} } } })();
